<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <title>TaskFlow</title>
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap");
      .f { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; }
    </style>
    <radialGradient id="alone" cx="640" cy="-40" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22" />
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
    <pattern id="punti" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="#ecedf0" fill-opacity="0.06" />
    </pattern>
    <linearGradient id="bordo" x1="0" y1="0" x2="0" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35" />
      <stop offset="0.5" stop-color="#262a32" />
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1280" height="640" fill="#0b0c0f" />
  <rect width="1280" height="640" fill="url(#punti)" />
  <rect width="1280" height="640" fill="url(#alone)" />
  <rect x="0.5" y="0.5" width="1279" height="639" rx="0" stroke="url(#bordo)" />

  <!-- Logo: check nel quadrato (griglia 32, scala 5) -->
  <g transform="translate(560 118) scale(5)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="26" height="26" rx="8" fill="#2dd4bf" fill-opacity="0.1" stroke="#2dd4bf" stroke-width="2.2" />
    <path d="M10 16.5l4 4 8-9" stroke="#2dd4bf" stroke-width="2.2" />
  </g>

  <!-- Nome e payoff -->
  <text class="f" x="640" y="410" text-anchor="middle" font-size="120" font-weight="700" letter-spacing="-3" fill="#ecedf0">TaskFlow</text>
  <text class="f" x="640" y="462" text-anchor="middle" font-size="30" fill="#9aa0ab">Organizza la tua giornata</text>

  <!-- Chip di stato -->
  <g class="f" font-size="22" font-weight="500" stroke-linecap="round" stroke-linejoin="round">
    <rect x="374" y="511" width="148" height="48" rx="24" fill="#14161b" stroke="#262a32" />
    <g transform="translate(392 523.6) scale(0.95)" stroke="#9aa0ab" stroke-width="1.9">
      <circle cx="12" cy="12" r="8" />
    </g>
    <text x="424" y="543" fill="#ecedf0" stroke="none">Da fare</text>

    <rect x="538" y="511" width="157" height="48" rx="24" fill="#14161b" stroke="#262a32" />
    <g transform="translate(556 523.6) scale(0.95)" stroke="#7cb4f5" stroke-width="1.9">
      <circle cx="12" cy="12" r="8" />
      <path d="M12 7.5a4.5 4.5 0 0 1 0 9z" fill="#7cb4f5" stroke="none" />
    </g>
    <text x="588" y="543" fill="#ecedf0" stroke="none">In corso</text>

    <rect x="711" y="511" width="196" height="48" rx="24" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.45" />
    <g transform="translate(729 523.6) scale(0.95)" stroke="#2dd4bf" stroke-width="1.9">
      <circle cx="12" cy="12" r="8" />
      <path d="M8.5 12.2l2.4 2.4 4.6-4.8" />
    </g>
    <text x="761" y="543" fill="#ecedf0" stroke="none">Completato</text>
  </g>
</svg>
